# ==========================================
# Render Blueprint Configuration (render.yaml)
# https://render.com/docs/blueprint-spec
# ==========================================

services:
  - type: web
    name: independent-minds-initiative
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_USERNAME
        value: admin
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: Independentminds.in@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: '"Independent Minds Initiative" <Independentminds.in@gmail.com>'
